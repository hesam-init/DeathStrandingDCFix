;;;;;;;;;; General ;;;;;;;;;;

[Intro Skip]
; Skips company logos on game startup.
Enabled = true

[Override FPS Limit]
Enabled = true
Limit = 1000

[Custom Resolution]
; Replaces the highest resolution option for 16:9/21:9 in-game with your custom resolution.
; Leave at 0 if you would like your desktop resolution used.
Enabled = true
Width = 0
Height = 0

[Force Entity Updates]
; Forces certain game entities to update every frame. This can smooth out perceived camera stutter.
Enabled = true

[Gameplay FOV]
; Adjust multiplier to increase/decrease gameplay FOV. i.e Set to 1.2 for 20% higher FOV.
; Valid range: 0.1 to 2.0
Multiplier = 1.0

;;;;;;;;;; Ultrawide/Narrower ;;;;;;;;;;

[Center HUD]
; Set "Enabled" to true to adjust the gameplay HUD to 16:9. (Ultrawide-only)
Enabled = false

[Fix Movies]
; Fixes cropped movies when using an ultrawide resolution.
Enabled = true

[Fix FOV]
; Fixes cropped FOV when using a narrower than 16:9 resolution.
Enabled = true

[Fix HUD]
; Fixes cropped HUD when using a narrower than 16:9 resolution.
Enabled = true
